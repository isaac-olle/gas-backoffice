name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
    secrets:
      DO_TOKEN:
        required: true
      DO_APP_ID:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Pin image to sha-${{ inputs.sha }}
        run: |
          doctl apps spec get ${{ secrets.DO_APP_ID }} | \
            sed "s/tag:.*/tag: sha-${{ inputs.sha }}/" | \
            doctl apps update ${{ secrets.DO_APP_ID }} --spec -

      - name: Create deployment
        run: doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait
