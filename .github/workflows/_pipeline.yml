name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  terraform-trigger:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check terraform changes
        id: tf_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^deploy/terraform/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: deploy/terraform
          soft_fail: true

      - name: Trigger infrastructure deploy
        if: steps.tf_changes.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GAS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/isaac-olle/gas/dispatches \
            -d '{
              "event_type": "backoffice-terraform-changed",
              "client_payload": {
                "environment": "${{ inputs.environment }}",
                "sha": "${{ github.sha }}"
              }
            }'


  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DO Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_TOKEN }}
          password: ${{ secrets.DO_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/backoffice:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    environment: ${{ inputs.environment }}

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Pin image to sha-${{ github.sha }}
        run: |
          doctl apps spec get ${{ secrets.DO_APP_ID }} | \
            sed "s/tag:.*/tag: sha-${{ github.sha }}/" | \
            doctl apps update ${{ secrets.DO_APP_ID }} --spec -

      - name: Create deployment
        run: doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait
