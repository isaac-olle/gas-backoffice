name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DO Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_TOKEN }}
          password: ${{ secrets.DO_TOKEN }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/backoffice:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/backoffice:${{ inputs.environment }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- deploy/golang-migrate/; then
            echo "run_migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Update app spec
        env:
          DO_APP_ID: ${{ vars[format('{0}_DO_APP_ID', inputs.environment)] }}
          RUN_MIGRATIONS: ${{ steps.changes.outputs.run_migrations }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          doctl apps spec get $DO_APP_ID > /tmp/spec.yaml
          python3 << 'PYEOF'
          import yaml, os

          with open('/tmp/spec.yaml') as f:
              spec = yaml.safe_load(f)

          tag = os.environ['IMAGE_TAG']
          run_migrations = os.environ['RUN_MIGRATIONS']

          for svc in spec.get('services', []):
              svc['image']['tag'] = tag

          for job in spec.get('jobs', []):
              job['image']['tag'] = tag
              if job['name'] == 'pre-deploy':
                  job_envs = job.setdefault('envs', [])
                  for env in job_envs:
                      if env['key'] == 'RUN_MIGRATIONS':
                          env['value'] = run_migrations
                          break
                  else:
                      job_envs.append({'key': 'RUN_MIGRATIONS', 'value': run_migrations, 'scope': 'RUN_TIME'})

          with open('/tmp/spec.yaml', 'w') as f:
              yaml.dump(spec, f, default_flow_style=False, allow_unicode=True)
          PYEOF
          doctl apps update $DO_APP_ID --spec /tmp/spec.yaml --wait

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name != 'pull_request'

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Delete old tagged images
        run: |
          ENV_TAG="${{ inputs.environment }}"
          KEEP_SHA="sha-${{ github.sha }}"
          doctl registry repository list-tags backoffice --no-header \
            | awk '{print $1}' \
            | grep -v "^${ENV_TAG}$" \
            | grep -v "^${KEEP_SHA}$" \
            | xargs -r -I {} doctl registry repository delete-tag backoffice {} --force

      - name: Garbage collect registry
        run: doctl registry garbage-collection start --include-untagged-manifests --force
