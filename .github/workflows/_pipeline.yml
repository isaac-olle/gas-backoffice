name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DO Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_TOKEN }}
          password: ${{ secrets.DO_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/backoffice:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/backoffice:${{ inputs.environment }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Pin image to sha-${{ github.sha }}
        env:
          DO_APP_ID: ${{ vars[format('{0}_DO_APP_ID', inputs.environment)] }}
        run: |
          doctl apps spec get $DO_APP_ID | \
            sed "s/tag:.*/tag: sha-${{ github.sha }}/" | \
            doctl apps update $DO_APP_ID --spec - --wait

      - name: Delete old tagged images
        run: |
          ENV_TAG="${{ inputs.environment }}"
          KEEP_SHA="sha-${{ github.sha }}"
          doctl registry repository list-tags backoffice --no-header \
            | awk '{print $1}' \
            | grep -v "^${ENV_TAG}$" \
            | grep -v "^${KEEP_SHA}$" \
            | xargs -r -I {} doctl registry repository delete-tag backoffice {} --force

      - name: Garbage collect registry
        run: doctl registry garbage-collection start --include-untagged-manifests --force
