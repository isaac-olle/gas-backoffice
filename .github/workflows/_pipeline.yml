name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

env:
  REGISTRY: ${{ secrets.DO_REGISTRY }}
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DO Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_TOKEN }}
          password: ${{ secrets.DO_TOKEN }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/backoffice:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/backoffice:${{ inputs.environment }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect pre-deploy job changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_migrations=true" >> $GITHUB_OUTPUT
            echo "run_seed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files: $CHANGED"
            if echo "$CHANGED" | grep -q "^deploy/golang-migrate/"; then
              echo "run_migrations=true" >> $GITHUB_OUTPUT
            else
              echo "run_migrations=false" >> $GITHUB_OUTPUT
            fi
            if echo "$CHANGED" | grep -q "^cmd/db_seed/"; then
              echo "run_seed=true" >> $GITHUB_OUTPUT
            else
              echo "run_seed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Update app spec
        env:
          DO_APP_ID: ${{ vars[format('{0}_DO_APP_ID', inputs.environment)] }}
          RUN_MIGRATIONS: ${{ steps.changes.outputs.run_migrations }}
          RUN_SEED: ${{ steps.changes.outputs.run_seed }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          doctl apps spec get $DO_APP_ID > /tmp/spec.yaml
          python3 << 'PYEOF'
          import yaml, os

          with open('/tmp/spec.yaml') as f:
              spec = yaml.safe_load(f)

          tag = os.environ['IMAGE_TAG']
          run_migrations = os.environ['RUN_MIGRATIONS']
          run_seed = os.environ['RUN_SEED']

          for svc in spec.get('services', []):
              svc['image']['tag'] = tag

          for job in spec.get('jobs', []):
              job['image']['tag'] = tag
              for env in job.get('envs', []):
                  if job['name'] == 'migrate' and env['key'] == 'RUN_MIGRATIONS':
                      env['value'] = run_migrations
                  if job['name'] == 'db-seed' and env['key'] == 'RUN_SEED':
                      env['value'] = run_seed

          with open('/tmp/spec.yaml', 'w') as f:
              yaml.dump(spec, f, default_flow_style=False, allow_unicode=True)
          PYEOF
          doctl apps update $DO_APP_ID --spec /tmp/spec.yaml --wait

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Delete old tagged images
        run: |
          ENV_TAG="${{ inputs.environment }}"
          KEEP_SHA="sha-${{ github.sha }}"
          doctl registry repository list-tags backoffice --no-header \
            | awk '{print $1}' \
            | grep -v "^${ENV_TAG}$" \
            | grep -v "^${KEEP_SHA}$" \
            | xargs -r -I {} doctl registry repository delete-tag backoffice {} --force

      - name: Garbage collect registry
        run: doctl registry garbage-collection start --include-untagged-manifests --force
