name: Secret scanning

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact=100 --log-opts="-m HEAD" /repo
