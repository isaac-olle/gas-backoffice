environment: ${ENV}

server:
  port: ${API_PORT}
  shutdown_timeout: 30
  allowed_origins: "${ALLOWED_ORIGINS}"
  cookie_origins: "${COOKIE_ORIGINS}"

application:
  name: gas
  seed_token: ${SEED_TOKEN}
  backoffice_client_id: ${GAS_BACKOFFICE_CLIENT_ID}
  backoffice_protected_resource_id: ${GAS_BACKOFFICE_PROTECTED_RESOURCE_ID}
  backoffice_client_redirect_uri: "${GAS_BACKOFFICE_CLIENT_REDIRECT_URI}"
  backoffice_client_secret: ${GAS_BACKOFFICE_CLIENT_SECRET}
  protocol_url: ${GAS_PROTOCOL_URL}

databases:
  postgres: ${POSTGRES_DSN}
  migrations_dsn: ${MIGRATIONS_DSN}

security:
  encryption_key: ${ENCRYPTION_KEY}
