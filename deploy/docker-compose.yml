services:

  postgres:
    container_name: gas-postgres
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql-users.sh:/docker-entrypoint-initdb.d/00-users.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas_backoffice_admin -d gas_backoffice"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    container_name: gas-migrate
    image: migrate/migrate:v4.17.1
    volumes:
      - ./golang-migrate:/migrations
    env_file:
      - .env
    command: >
      -path=/migrations
      -database=postgres://${ADMIN_USER}:${ADMIN_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
      up
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

