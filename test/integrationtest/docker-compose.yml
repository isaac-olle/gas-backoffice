name: gas-backoffice-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gas_backoffice
      POSTGRES_USER: gas_admin
      POSTGRES_PASSWORD: integration-admin
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-test-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gas_admin -d gas_backoffice"]
      interval: 2s
      timeout: 5s
      retries: 30

